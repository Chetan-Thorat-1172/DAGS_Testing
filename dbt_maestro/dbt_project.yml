name: maestro_dbt_smoke
version: "1.0.0"
config-version: 2

# Databricks generates the profiles.yml for a dbt task and passes --profiles-dir
# to it. `dbt debug` confirmed it generates a profile named `databricks` with
# target `databricks_cluster`, so this name is correct.
profile: databricks

model-paths: ["models"]

# The generated profile connects with catalog=hive_metastore, which this workspace
# blocks (legacy access off). We cannot edit that generated file, so the session
# has to be moved into Unity Catalog from inside the project.
#
# on-run-start runs on dbt's *master* connection only. With `Concurrency: 8
# threads` each model runs on its own connection, so this alone is not sufficient
# — the per-model pre_hook below is the one that applies where the DDL happens.
on-run-start:
  - "use catalog maestro_pi"

models:
  maestro_dbt_smoke:
    # Controls the relation name: maestro_pi.default.maestro_smoke_model.
    # Confirmed working — the run log shows dbt targeting exactly that.
    +catalog: maestro_pi
    +materialized: table
    # Runs on the same connection as the model, so the CREATE TABLE and the
    # schema handling around it resolve against Unity Catalog rather than falling
    # back to the session's hive_metastore default.
    +pre_hook:
      - "use catalog maestro_pi"
